<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="60%" style="stop-color:#B0E0E6"/>
      <stop offset="100%" style="stop-color:#E0F7FA"/>
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4E4BA"/>
      <stop offset="100%" style="stop-color:#E8D5A0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#0288D1"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF9C4"/>
      <stop offset="60%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFA000"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="500" fill="url(#sky)" rx="16"/>

  <!-- Sun (Este) -->
  <circle cx="530" cy="140" r="50" fill="url(#sun)" opacity="0.9"/>
  <g stroke="#FFB300" stroke-width="3" opacity="0.6">
    <line x1="530" y1="75" x2="530" y2="60"/>
    <line x1="530" y1="220" x2="530" y2="205"/>
    <line x1="465" y1="140" x2="450" y2="140"/>
    <line x1="610" y1="140" x2="595" y2="140"/>
    <line x1="484" y1="94" x2="473" y2="83"/>
    <line x1="576" y1="186" x2="587" y2="197"/>
    <line x1="576" y1="94" x2="587" y2="83"/>
    <line x1="484" y1="186" x2="473" y2="197"/>
  </g>

  <!-- Sea -->
  <ellipse cx="300" cy="340" rx="300" ry="50" fill="url(#sea)" opacity="0.5"/>
  <rect x="0" y="340" width="600" height="20" fill="url(#sea)" opacity="0.4" rx="0"/>

  <!-- Sand / ground -->
  <rect x="0" y="350" width="600" height="150" fill="url(#sand)" rx="0"/>
  <!-- Sand texture dots -->
  <g fill="#D4C48A" opacity="0.5">
    <circle cx="50" cy="380" r="2"/><circle cx="120" cy="400" r="1.5"/>
    <circle cx="200" cy="370" r="2"/><circle cx="350" cy="390" r="1.5"/>
    <circle cx="450" cy="375" r="2"/><circle cx="550" cy="405" r="1.5"/>
    <circle cx="80" cy="420" r="1.5"/><circle cx="300" cy="430" r="2"/>
    <circle cx="500" cy="440" r="1.5"/><circle cx="150" cy="450" r="2"/>
  </g>

  <!-- Waves -->
  <path d="M0,340 Q50,330 100,340 Q150,350 200,340 Q250,330 300,340 Q350,350 400,340 Q450,330 500,340 Q550,350 600,340" fill="none" stroke="#4FC3F7" stroke-width="2" opacity="0.6"/>
  <path d="M0,348 Q60,338 120,348 Q180,358 240,348 Q300,338 360,348 Q420,358 480,348 Q540,338 600,348" fill="none" stroke="#29B6F6" stroke-width="1.5" opacity="0.4"/>

  <!-- Person (child) -->
  <!-- Head -->
  <circle cx="300" cy="240" r="28" fill="#FFCC80"/>
  <!-- Hair -->
  <path d="M272,235 Q272,210 300,210 Q328,210 328,235" fill="#5D4037"/>
  <!-- Hat -->
  <ellipse cx="300" cy="215" rx="32" ry="8" fill="#E53935"/>
  <rect x="280" y="200" width="40" height="18" rx="5" fill="#E53935"/>
  <!-- Eyes -->
  <circle cx="290" cy="242" r="3" fill="#333"/>
  <circle cx="310" cy="242" r="3" fill="#333"/>
  <!-- Smile -->
  <path d="M290,252 Q300,262 310,252" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="285" y="268" width="30" height="40" rx="5" fill="#4CAF50"/>

  <!-- Arms extended horizontally -->
  <!-- Left arm (Oeste) -->
  <line x1="285" y1="280" x2="220" y2="280" stroke="#FFCC80" stroke-width="10" stroke-linecap="round"/>
  <!-- Right arm (Este) -->
  <line x1="315" y1="280" x2="380" y2="280" stroke="#FFCC80" stroke-width="10" stroke-linecap="round"/>

  <!-- Legs -->
  <line x1="293" y1="308" x2="288" y2="348" stroke="#FFCC80" stroke-width="9" stroke-linecap="round"/>
  <line x1="307" y1="308" x2="312" y2="348" stroke="#FFCC80" stroke-width="9" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="285" cy="350" rx="10" ry="6" fill="#333"/>
  <ellipse cx="315" cy="350" rx="10" ry="6" fill="#333"/>

  <!-- Shorts -->
  <rect x="283" y="303" width="34" height="15" rx="4" fill="#1565C0"/>

  <!-- Cardinal point labels -->
  <!-- Norte (top) -->
  <rect x="245" y="60" width="110" height="40" rx="20" fill="#2196F3" opacity="0.9"/>
  <text x="300" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="white">Norte</text>
  <!-- Arrow up -->
  <polygon points="300,110 290,130 310,130" fill="#2196F3" opacity="0.8"/>

  <!-- Sur (bottom) -->
  <rect x="250" y="440" width="100" height="40" rx="20" fill="#F44336" opacity="0.9"/>
  <text x="300" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="white">Sur</text>
  <!-- Arrow down -->
  <polygon points="300,430 290,410 310,410" fill="#F44336" opacity="0.8"/>

  <!-- Este (right) -->
  <rect x="430" y="260" width="100" height="40" rx="20" fill="#FF9800" opacity="0.9"/>
  <text x="480" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="white">Este</text>
  <!-- Arrow right -->
  <polygon points="420,280 400,270 400,290" fill="#FF9800" opacity="0.8"/>

  <!-- Oeste (left) -->
  <rect x="70" y="260" width="110" height="40" rx="20" fill="#9C27B0" opacity="0.9"/>
  <text x="125" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="white">Oeste</text>
  <!-- Arrow left -->
  <polygon points="190,280 210,270 210,290" fill="#9C27B0" opacity="0.8"/>

  <!-- Small compass in bottom-right -->
  <g transform="translate(540, 440)">
    <circle cx="0" cy="0" r="30" fill="white" stroke="#333" stroke-width="2" opacity="0.8"/>
    <!-- N -->
    <polygon points="0,-25 -6,-8 6,-8" fill="#E53935"/>
    <!-- S -->
    <polygon points="0,25 -6,8 6,8" fill="#ccc"/>
    <!-- E -->
    <polygon points="25,0 8,-6 8,6" fill="#ccc"/>
    <!-- O -->
    <polygon points="-25,0 -8,-6 -8,6" fill="#ccc"/>
    <text x="0" y="-14" text-anchor="middle" font-size="8" font-weight="bold" fill="#333" font-family="Arial">N</text>
    <text x="0" y="20" text-anchor="middle" font-size="8" font-weight="bold" fill="#333" font-family="Arial">S</text>
    <text x="16" y="4" text-anchor="middle" font-size="8" font-weight="bold" fill="#333" font-family="Arial">E</text>
    <text x="-16" y="4" text-anchor="middle" font-size="8" font-weight="bold" fill="#333" font-family="Arial">O</text>
  </g>
</svg>