<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Práctica Estudios Sociales — Segundo Trimestre</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(160deg, #FFF3E0 0%, #E0F7FA 100%);
    color: #222;
    margin: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .app { max-width: 760px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
  .board {
    background: #fff;
    border: 6px solid #E65100;
    border-radius: 26px;
    padding: 20px 22px 26px;
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  h1 { text-align: center; color: #E65100; margin: 6px 0 2px; font-size: clamp(23px, 5vw, 33px); }
  .subtitle { text-align: center; color: #777; font-style: italic; margin: 0 0 14px; font-size: clamp(14px, 3vw, 17px); }
  .intro-emoji { text-align: center; font-size: 56px; margin: 8px 0; }
  .choose-label { text-align: center; color: #E65100; font-weight: bold; font-size: 19px; margin: 10px 0 14px; }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .topic-btn {
    font-family: inherit;
    font-size: 19px;
    font-weight: bold;
    color: #BF360C;
    background: #FFF3E0;
    border: 3px solid #FB8C00;
    border-radius: 18px;
    padding: 18px 12px;
    min-height: 64px;
    cursor: pointer;
    transition: transform .1s;
  }
  .topic-btn:active { transform: scale(.96); background: #FFE0B2; }
  .topic-btn.all { background: #E0F2F1; border-color: #00897B; color: #004D40; }
  .topic-btn .icon { font-size: 28px; display: block; margin-bottom: 4px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-size: 16px; color: #555; font-weight: bold; }
  .progress-wrap { flex: 1; height: 16px; background: #eee; border-radius: 10px; overflow: hidden; border: 2px solid #ddd; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #FB8C00, #26A69A); border-radius: 10px; transition: width .3s; }
  .score-chip { background: #FFF3E0; border: 2px solid #FB8C00; border-radius: 12px; padding: 4px 12px; color: #BF360C; white-space: nowrap; }
  .q-category { text-align: center; font-size: 15px; color: #888; margin-bottom: 4px; }
  .q-visual { text-align: center; margin: 6px 0 4px; }
  .q-visual img {
    max-width: min(340px, 92%);
    max-height: 200px;
    border-radius: 14px;
    border: 3px solid #FFCC80;
    box-shadow: 0 3px 8px rgba(0,0,0,.12);
  }
  .q-text {
    text-align: center;
    font-size: clamp(19px, 4vw, 24px);
    color: #BF360C;
    font-weight: bold;
    margin: 8px 0 16px;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .options { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 600px) { .options { grid-template-columns: 1fr 1fr; } }
  .opt-btn {
    font-family: inherit;
    font-size: 18px;
    text-align: center;
    background: #fff;
    color: #333;
    border: 3px solid #FFB74D;
    border-radius: 16px;
    padding: 14px 14px;
    min-height: 58px;
    cursor: pointer;
    transition: transform .08s;
  }
  .opt-btn:active { transform: scale(.97); }
  .opt-btn.correct { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; font-weight: bold; }
  .opt-btn.wrong { background: #FFEBEE; border-color: #E57373; color: #B71C1C; }
  .feedback { text-align: center; font-size: 19px; font-weight: bold; min-height: 30px; margin: 14px 0 6px; }
  .feedback.good { color: #2E7D32; }
  .feedback.bad { color: #C62828; }
  .next-btn, .big-btn {
    font-family: inherit;
    display: block;
    margin: 12px auto 0;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    background: #E65100;
    border: none;
    border-radius: 16px;
    padding: 16px 40px;
    min-height: 58px;
    cursor: pointer;
    visibility: hidden;
  }
  .next-btn.show, .big-btn { visibility: visible; }
  .next-btn:active, .big-btn:active { transform: scale(.97); }
  .result-emoji { text-align: center; font-size: 72px; margin: 10px 0; }
  .result-title { text-align: center; font-size: 30px; color: #E65100; font-weight: bold; margin: 4px 0; }
  .result-score { text-align: center; font-size: 22px; color: #555; margin: 6px 0 4px; }
  .stars { text-align: center; font-size: 40px; letter-spacing: 6px; margin: 8px 0; }
  .result-msg { text-align: center; font-size: 18px; color: #666; margin-bottom: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="board">
    <h1>🌴 Práctica Estudios Sociales</h1>
    <p class="subtitle">Segundo trimestre — Puntarenas y la Anexión de Nicoya</p>

    <div id="screen-start">
      <div class="intro-emoji">🗺️🌊</div>
      <p class="choose-label">¿Qué quieres practicar hoy?</p>
      <div class="topic-grid" id="topic-grid"></div>
    </div>

    <div id="screen-quiz" class="hidden">
      <div class="topbar">
        <span id="q-counter">1/10</span>
        <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
        <span class="score-chip" id="score-chip">⭐ 0</span>
      </div>
      <p class="q-category" id="q-category"></p>
      <div class="q-visual" id="q-visual"></div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback"></p>
      <button class="next-btn" id="next-btn">Siguiente ➜</button>
    </div>

    <div id="screen-result" class="hidden">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <p class="result-title" id="result-title">¡Práctica completada!</p>
      <div class="stars" id="stars"></div>
      <p class="result-score" id="result-score"></p>
      <p class="result-msg" id="result-msg"></p>
      <button class="big-btn" id="retry-btn">Jugar otra vez 🔄</button>
      <button class="big-btn" id="home-btn" style="background:#00897B; margin-top:10px;">Elegir otro tema 🗺️</button>
    </div>
  </div>
</div>

const TOPICS = [
  ["relieve", "🏔️", "El relieve"],
  ["puntarenas", "🗺️", "Puntarenas"],
  ["historia", "📜", "Historia"],
  ["economia", "💰", "Economía y tradiciones"],
  ["nicoya", "🇨🇷", "Anexión de Nicoya"]
];
const TOPIC_LABEL = { relieve:"🏔️ El relieve", puntarenas:"🗺️ Puntarenas", historia:"📜 Historia", economia:"💰 Economía y tradiciones", nicoya:"🇨🇷 Anexión de Nicoya" };
const PRAISE = ["¡Excelente! 🎉","¡Muy bien! 🌟","¡Correcto! ✅","¡Genial! 🥳","¡Eres una crack! 💪"];
const OOPS = ["¡Casi! La respuesta era: ","Ojo 👀 La respuesta correcta era: ","No pasa nada, era: "];

let questions = [], idx = 0, score = 0, currentMode = "";

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestion(raw, cat){
  const correct = raw.opts[0];
  const opts = shuffle(raw.opts);
  return { q: raw.q, img: raw.img || null, opts, a: opts.indexOf(correct), cat };
}

function startQuiz(mode){
  currentMode = mode;
  if (mode === "todos") {
    let pool = [];
    for (const [key] of TOPICS) pool.push(...shuffle(BANK[key]).slice(0, 4).map(r => buildQuestion(r, key)));
    questions = shuffle(pool);
  } else {
    questions = shuffle(BANK[mode].map(r => buildQuestion(r, mode)));
  }
  idx = 0; score = 0;
  show("screen-quiz");
  renderQuestion();
}

function show(id){
  for (const s of ["screen-start","screen-quiz","screen-result"])
    document.getElementById(s).classList.toggle("hidden", s !== id);
}

function renderQuestion(){
  const q = questions[idx];
  document.getElementById("q-counter").textContent = (idx+1) + "/" + questions.length;
  document.getElementById("progress-bar").style.width = (idx / questions.length * 100) + "%";
  document.getElementById("score-chip").textContent = "⭐ " + score;
  document.getElementById("q-category").textContent = TOPIC_LABEL[q.cat] || "";
  document.getElementById("q-visual").innerHTML = q.img && IMGS[q.img] ? '<img src="' + IMGS[q.img] + '" alt="">' : "";
  document.getElementById("q-text").textContent = q.q;
  const box = document.getElementById("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.textContent = opt;
    b.addEventListener("click", () => answer(i, b), {passive:true});
    box.appendChild(b);
  });
  const fb = document.getElementById("feedback");
  fb.textContent = ""; fb.className = "feedback";
  document.getElementById("next-btn").classList.remove("show");
}

function answer(i, btn){
  const q = questions[idx];
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById("feedback");
  if (i === q.a) {
    score++;
    btn.classList.add("correct");
    fb.textContent = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    fb.classList.add("good");
  } else {
    btn.classList.add("wrong");
    buttons[q.a].classList.add("correct");
    fb.textContent = OOPS[Math.floor(Math.random()*OOPS.length)] + q.opts[q.a];
    fb.classList.add("bad");
  }
  document.getElementById("score-chip").textContent = "⭐ " + score;
  const nb = document.getElementById("next-btn");
  nb.classList.add("show");
  nb.textContent = (idx === questions.length-1) ? "Ver resultado 🏁" : "Siguiente ➜";
}

function finish(){
  document.getElementById("progress-bar").style.width = "100%";
  const pct = score / questions.length;
  const stars = pct === 1 ? 5 : pct >= .9 ? 4 : pct >= .7 ? 3 : pct >= .5 ? 2 : 1;
  document.getElementById("stars").textContent = "⭐".repeat(stars) + "☆".repeat(5-stars);
  document.getElementById("result-score").textContent = "Acertaste " + score + " de " + questions.length + " preguntas";
  document.getElementById("result-emoji").textContent = pct === 1 ? "🏆" : pct >= .7 ? "🎉" : pct >= .5 ? "😊" : "💪";
  document.getElementById("result-title").textContent =
    pct === 1 ? "¡PERFECTO, Luciana!" : pct >= .7 ? "¡Muy bien hecho!" : pct >= .5 ? "¡Buen intento!" : "¡Sigue practicando!";
  document.getElementById("result-msg").textContent =
    pct === 1 ? "¡Conoces Puntarenas mejor que nadie! 🌴✨" :
    pct >= .7 ? "¡Ya casi eres experta en Puntarenas!" :
    pct >= .5 ? "Repasa las fichas un poquito más." :
    "Cada intento te acerca más. ¡Otra vez!";
  show("screen-result");
}

document.getElementById("next-btn").addEventListener("click", () => {
  if (idx === questions.length - 1) { finish(); return; }
  idx++;
  renderQuestion();
});
document.getElementById("retry-btn").addEventListener("click", () => startQuiz(currentMode));
document.getElementById("home-btn").addEventListener("click", () => show("screen-start"));

const grid = document.getElementById("topic-grid");
for (const [key, icon, label] of TOPICS) {
  const b = document.createElement("button");
  b.className = "topic-btn";
  b.innerHTML = '<span class="icon">' + icon + '</span>' + label;
  b.addEventListener("click", () => startQuiz(key), {passive:true});
  grid.appendChild(b);
}
const all = document.createElement("button");
all.className = "topic-btn all";
all.innerHTML = '<span class="icon">🌟</span>¡Práctica completa! (todos)';
all.addEventListener("click", () => startQuiz("todos"), {passive:true});
grid.appendChild(all);
</script>
