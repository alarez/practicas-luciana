<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>Reto Geográfico — Quiz de Luciana</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(160deg, #E8F4FD 0%, #FDF6E3 100%);
    color: #222;
    margin: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .app {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* ---------- Maleta / header ---------- */
  .suitcase {
    background: #fff;
    border: 6px solid #2b2b2b;
    border-radius: 26px;
    padding: 20px 22px 26px;
    position: relative;
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .handle {
    width: 140px;
    height: 26px;
    border: 6px solid #2b2b2b;
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    margin: 0 auto;
    background: transparent;
  }
  h1 {
    text-align: center;
    color: #1F4E79;
    margin: 6px 0 2px;
    font-size: clamp(24px, 5vw, 34px);
  }
  .subtitle {
    text-align: center;
    color: #777;
    font-style: italic;
    margin: 0 0 14px;
    font-size: clamp(14px, 3vw, 17px);
  }
  /* ---------- Pantalla inicio ---------- */
  .intro-emoji { text-align: center; font-size: 56px; margin: 8px 0; }
  .choose-label {
    text-align: center;
    color: #1F4E79;
    font-weight: bold;
    font-size: 19px;
    margin: 10px 0 14px;
  }
  .country-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }
  .country-btn {
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    color: #1F4E79;
    background: #FFF8DC;
    border: 3px solid #E0A800;
    border-radius: 18px;
    padding: 18px 12px;
    min-height: 64px;
    cursor: pointer;
    transition: transform .1s;
  }
  .country-btn:active { transform: scale(.96); background: #ffeeb0; }
  .country-btn.all {
    background: #E3F2FD;
    border-color: #1F4E79;
  }
  .country-btn .flag { font-size: 28px; display: block; margin-bottom: 4px; }
  /* ---------- Quiz ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 16px;
    color: #555;
    font-weight: bold;
  }
  .progress-wrap {
    flex: 1;
    height: 16px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #ddd;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4CAF50, #8BC34A);
    border-radius: 10px;
    transition: width .3s;
  }
  .score-chip {
    background: #FFF8DC;
    border: 2px solid #E0A800;
    border-radius: 12px;
    padding: 4px 12px;
    color: #8a6d00;
    white-space: nowrap;
  }
  .q-category {
    text-align: center;
    font-size: 15px;
    color: #888;
    margin-bottom: 4px;
  }
  .q-text {
    text-align: center;
    font-size: clamp(20px, 4.2vw, 26px);
    color: #1F4E79;
    font-weight: bold;
    margin: 8px 0 18px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 600px) {
    .options { grid-template-columns: 1fr 1fr; }
  }
  .opt-btn {
    font-family: inherit;
    font-size: 19px;
    text-align: center;
    background: #fff;
    color: #333;
    border: 3px solid #90CAF9;
    border-radius: 16px;
    padding: 16px 14px;
    min-height: 60px;
    cursor: pointer;
    transition: transform .08s;
  }
  .opt-btn:active { transform: scale(.97); }
  .opt-btn.correct {
    background: #E8F5E9;
    border-color: #4CAF50;
    color: #1B5E20;
    font-weight: bold;
  }
  .opt-btn.wrong {
    background: #FFEBEE;
    border-color: #E57373;
    color: #B71C1C;
  }
  .opt-btn:disabled { opacity: 1; }
  .feedback {
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    min-height: 30px;
    margin: 16px 0 6px;
  }
  .feedback.good { color: #2E7D32; }
  .feedback.bad { color: #C62828; }
  .next-btn, .big-btn {
    font-family: inherit;
    display: block;

    font-size: 20px;
    font-weight: bold;
    color: #fff;
    background: #1F4E79;
    border: none;
    border-radius: 16px;
    padding: 16px 40px;

    cursor: pointer;
    visibility: hidden;
  }
  .next-btn.show, .big-btn { visibility: visible; }
  .next-btn:active, .big-btn:active { transform: scale(.97); }
  /* ---------- Resultado ---------- */
  .result-emoji { text-align: center; font-size: 72px; margin: 10px 0; }
  .result-title {

    color: #1F4E79;
    font-weight: bold;

  }
  .result-score {

  .result-msg {

  .wheel {

    display:flex; align-items:center; justify-content:center;

  }
  /* ---------- botón de salir ---------- */
  .close-btn {

    color: #90A4AE; background: #fff;

  .crumbs .here { color: #78909C; font-weight: bold; padding: 0 4px; white-space: nowrap; }
  .hidden { display: none !important; }
</style>
</head>

    {q:"¿Cuál es la moneda oficial de Portugal, España, Francia, Italia y Alemania?", opts:["El Euro (€)","El Dólar","El Peso","La Libra"], a:0, cat:"Europa"},
    {q:"¿En qué continente están Portugal, España, Francia, Italia y Alemania?", opts:["Europa","América","Asia","África"], a:0, cat:"Europa"}

const FLAGS = {"Portugal":"🇵🇹","España":"🇪🇸","Francia":"🇫🇷","Italia":"🇮🇹","Alemania":"🇩🇪"};
const PRAISE = ["¡Excelente! 🎉","¡Muy bien! 🌟","¡Correcto! ✅","¡Genial! 🥳","¡Eres una crack! 💪"];
const OOPS = ["¡Casi! La respuesta era: ","Ojo 👀 La respuesta correcta era: ","No pasa nada, era: "];

let questions = [], idx = 0, score = 0, currentMode = "";

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestion(raw, cat){
  const correctText = raw.opts[raw.a];
  const opts = shuffle(raw.opts);
  return { q: raw.q, opts, a: opts.indexOf(correctText), cat: raw.cat || cat };
}

function startQuiz(mode){
  currentMode = mode;
  let pool = [];
  if (mode === "todos") {
    for (const c of Object.keys(FLAGS)) pool.push(...shuffle(BANK[c]).slice(0,4).map(r=>buildQuestion(r,c)));
    pool.push(...BANK["_extra"].map(r=>buildQuestion(r,"Europa")));
    questions = shuffle(pool).slice(0, 20);
  } else {
    questions = shuffle(BANK[mode].map(r=>buildQuestion(r,mode)));
  }
  idx = 0; score = 0;
  show("screen-quiz");
  renderQuestion();
}

function show(id){
  for (const s of ["screen-start","screen-quiz","screen-result"])
    document.getElementById(s).classList.toggle("hidden", s !== id);
}

function renderQuestion(){
  const q = questions[idx];
  document.getElementById("q-counter").textContent = (idx+1) + "/" + questions.length;
  document.getElementById("progress-bar").style.width = (idx / questions.length * 100) + "%";
  document.getElementById("score-chip").textContent = "⭐ " + score;
  document.getElementById("q-category").textContent = (FLAGS[q.cat] || "🌍") + " " + q.cat;
  document.getElementById("q-text").textContent = q.q;
  const box = document.getElementById("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.textContent = opt;
    b.addEventListener("click", () => answer(i, b), {passive:true});
    box.appendChild(b);
  });
  const fb = document.getElementById("feedback");
  fb.textContent = ""; fb.className = "feedback";
  document.getElementById("next-btn").classList.remove("show");
}

function answer(i, btn){
  const q = questions[idx];
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById("feedback");
  if (i === q.a) {
    score++;
    btn.classList.add("correct");
    fb.textContent = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    fb.classList.add("good");
  } else {
    btn.classList.add("wrong");
    buttons[q.a].classList.add("correct");
    fb.textContent = OOPS[Math.floor(Math.random()*OOPS.length)] + q.opts[q.a];
    fb.classList.add("bad");
  }
  document.getElementById("score-chip").textContent = "⭐ " + score;
  document.getElementById("next-btn").classList.add("show");
  document.getElementById("next-btn").textContent = (idx === questions.length-1) ? "Ver resultado 🏁" : "Siguiente ➜";
}

function finish(){
  document.getElementById("progress-bar").style.width = "100%";
  const pct = score / questions.length;
  const stars = pct === 1 ? 5 : pct >= .9 ? 4 : pct >= .7 ? 3 : pct >= .5 ? 2 : 1;
  document.getElementById("stars").textContent = "⭐".repeat(stars) + "☆".repeat(5-stars);
  document.getElementById("result-score").textContent = "Acertaste " + score + " de " + questions.length + " preguntas";
  const emoji = pct === 1 ? "🏆" : pct >= .7 ? "🎉" : pct >= .5 ? "😊" : "💪";
  document.getElementById("result-emoji").textContent = emoji;
  document.getElementById("result-title").textContent =
    pct === 1 ? "¡PERFECTO, Luciana!" : pct >= .7 ? "¡Muy buen viaje!" : pct >= .5 ? "¡Buen intento!" : "¡Sigue practicando!";
  document.getElementById("result-msg").textContent =
    pct === 1 ? "¡Eres una exploradora experta! 🌍✨" :
    pct >= .7 ? "¡Ya casi te sabes toda Europa!" :
    pct >= .5 ? "Repasa un poquito más y serás experta." :
    "Cada viaje te hace más sabia. ¡Inténtalo otra vez!";
  show("screen-result");
}

document.getElementById("next-btn").addEventListener("click", () => {
  if (idx === questions.length - 1) { finish(); return; }
  idx++;
  renderQuestion();
});
document.getElementById("retry-btn").addEventListener("click", () => startQuiz(currentMode));
document.getElementById("home-btn").addEventListener("click", () => show("screen-start"));

/* ---------- botón de salir de la práctica ---------- */
(function(){
  const ov = document.createElement("div");
  ov.className = "exit-ov hidden";
  ov.innerHTML = '<div class="exit-box"><p>¿Querés salir de la práctica?</p>' +
    '<button class="exit-yes">Sí, salir 🚪</button>' +
    '<button class="exit-no">Seguir practicando 💪</button></div>';
  document.body.appendChild(ov);
  const hide = () => ov.classList.add("hidden");
  ov.querySelector(".exit-no").addEventListener("click", hide, {passive:true});
  ov.querySelector(".exit-yes").addEventListener("click", () => { hide(); show("screen-start"); }, {passive:true});
  document.getElementById("close-btn").addEventListener("click", () => ov.classList.remove("hidden"), {passive:true});
})();

// Botones de destino
const grid = document.getElementById("country-grid");
for (const c of Object.keys(FLAGS)) {
  const b = document.createElement("button");
  b.className = "country-btn";
  b.innerHTML = '<span class="flag">' + FLAGS[c] + '</span>' + c;
  b.addEventListener("click", () => startQuiz(c), {passive:true});
  grid.appendChild(b);
}
const all = document.createElement("button");
all.className = "country-btn all";
all.innerHTML = '<span class="flag">🌍✈️</span>¡Reto completo! (todos)';
all.addEventListener("click", () => startQuiz("todos"), {passive:true});
grid.appendChild(all);
</script>
