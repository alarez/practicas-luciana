<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>English Practice — Travel &amp; Nature Vocabulary</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(160deg, #FFEBEE 0%, #E3F2FD 100%);
    color: #222;
    margin: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .app { max-width: 760px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
  .board {
    background: #fff;
    border: 6px solid #C62828;
    border-radius: 26px;
    padding: 20px 22px 26px;
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  h1 { text-align: center; color: #C62828; margin: 6px 0 2px; font-size: clamp(22px, 5vw, 32px); }
  .subtitle { text-align: center; color: #777; font-style: italic; margin: 0 0 14px; font-size: clamp(14px, 3vw, 17px); }
  .intro-emoji { text-align: center; font-size: 56px; margin: 8px 0; }
  .choose-label { text-align: center; color: #C62828; font-weight: bold; font-size: 19px; margin: 10px 0 14px; }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .topic-btn {
    font-family: inherit;
    font-size: 19px;
    font-weight: bold;
    color: #B71C1C;
    background: #FFEBEE;
    border: 3px solid #E53935;
    border-radius: 18px;
    padding: 18px 12px;
    min-height: 64px;
    cursor: pointer;
    transition: transform .1s;
  }
  .topic-btn:active { transform: scale(.96); background: #FFCDD2; }
  .topic-btn.all { background: #E3F2FD; border-color: #1565C0; color: #0D47A1; }
  .topic-btn .icon { font-size: 28px; display: block; margin-bottom: 4px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-size: 16px; color: #555; font-weight: bold; }
  .progress-wrap { flex: 1; height: 16px; background: #eee; border-radius: 10px; overflow: hidden; border: 2px solid #ddd; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #E53935, #1E88E5); border-radius: 10px; transition: width .3s; }
  .score-chip { background: #FFEBEE; border: 2px solid #E53935; border-radius: 12px; padding: 4px 12px; color: #B71C1C; white-space: nowrap; }
  .q-category { text-align: center; font-size: 15px; color: #888; margin-bottom: 4px; }
  .q-visual { text-align: center; margin: 6px 0 4px; }
  .q-visual img {
    max-width: min(260px, 88%);
    max-height: 185px;
    border-radius: 14px;
    border: 3px solid #90CAF9;
    box-shadow: 0 3px 8px rgba(0,0,0,.12);
    background: #fff;
  }
  .big-emoji { text-align: center; font-size: 64px; }
  .big-word {
    text-align: center;
    font-size: clamp(30px, 7vw, 42px);
    font-weight: bold;
    color: #1565C0;
    background: #E3F2FD;
    border: 3px dashed #1E88E5;
    border-radius: 16px;
    padding: 10px 18px;
    width: fit-content;
    margin: 4px auto;
    letter-spacing: 2px;
  }
  .q-text {
    text-align: center;
    font-size: clamp(19px, 4vw, 24px);
    color: #B71C1C;
    font-weight: bold;
    margin: 8px 0 14px;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt-btn {
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    background: #fff;
    color: #333;
    border: 3px solid #90CAF9;
    border-radius: 16px;
    padding: 14px;
    min-height: 58px;
    cursor: pointer;
    transition: transform .08s;
    text-transform: capitalize;
  }
  .opt-btn:active { transform: scale(.97); }
  .opt-btn.img-opt { padding: 8px; min-height: 0; }
  .opt-btn.img-opt img {
    width: 100%;
    max-height: 140px;
    object-fit: contain;
    border-radius: 10px;
    display: block;
    pointer-events: none;
  }
  .opt-btn.correct { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
  .opt-btn.wrong { background: #FFEBEE; border-color: #E57373; color: #B71C1C; }
  .feedback { text-align: center; font-size: 19px; font-weight: bold; min-height: 30px; margin: 14px 0 6px; }
  .feedback.good { color: #2E7D32; }
  .feedback.bad { color: #C62828; }
  .next-btn, .big-btn {
    font-family: inherit;
    display: block;
    margin: 12px auto 0;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    background: #C62828;
    border: none;
    border-radius: 16px;
    padding: 16px 40px;
    min-height: 58px;
    cursor: pointer;
    visibility: hidden;
  }
  .next-btn.show, .big-btn { visibility: visible; }
  .next-btn:active, .big-btn:active { transform: scale(.97); }
  .result-emoji { text-align: center; font-size: 72px; margin: 10px 0; }
  .result-title { text-align: center; font-size: 30px; color: #C62828; font-weight: bold; margin: 4px 0; }
  .result-score { text-align: center; font-size: 22px; color: #555; margin: 6px 0 4px; }
  .stars { text-align: center; font-size: 40px; letter-spacing: 6px; margin: 8px 0; }
  .result-msg { text-align: center; font-size: 18px; color: #666; margin-bottom: 10px; }
  /* ---------- botón de salir ---------- */
  .close-btn {
    font-family: inherit;
    font-size: 19px; font-weight: bold; line-height: 1;
    color: #90A4AE; background: #fff;
    border: 2px solid #CFD8DC; border-radius: 50%;
    width: 38px; height: 38px; min-width: 38px;
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .close-btn:active { transform: scale(.92); background: #ECEFF1; }
  .exit-ov {
    position: fixed; inset: 0; z-index: 99;
    background: rgba(38,50,56,.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .exit-box {
    background: #fff; border-radius: 22px;
    padding: 24px 22px; max-width: 340px; width: 100%;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .exit-box p { font-size: 19px; font-weight: bold; color: #37474F; margin: 4px 0 18px; }
  .exit-box button {
    font-family: inherit; font-size: 17px; font-weight: bold;
    display: block; width: 100%; margin: 9px 0;
    border-radius: 14px; min-height: 52px; cursor: pointer; border: 3px solid transparent;
  }
  .exit-box .exit-yes { background: #EF5350; color: #fff; }
  .exit-box .exit-no { background: #fff; color: #546E7A; border-color: #CFD8DC; }
  .exit-box button:active { transform: scale(.97); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="board">
    <h1>🇬🇧 English Practice</h1>
    <p class="subtitle">Travel &amp; Nature Vocabulary — Luciana's quiz</p>

    <div id="screen-start">
      <div class="intro-emoji">🏕️✈️</div>
      <p class="choose-label">Choose your game:</p>
      <div class="topic-grid" id="topic-grid"></div>
    </div>

    <div id="screen-quiz" class="hidden">
      <div class="topbar">
        <button class="close-btn" id="close-btn" aria-label="Salir">✕</button>
        <span id="q-counter">1/12</span>
        <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
        <span class="score-chip" id="score-chip">⭐ 0</span>
      </div>
      <p class="q-category" id="q-category"></p>
      <div class="q-visual" id="q-visual"></div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback"></p>
      <button class="next-btn" id="next-btn">Next ➜</button>
    </div>

    <div id="screen-result" class="hidden">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <p class="result-title" id="result-title">Practice complete!</p>
      <div class="stars" id="stars"></div>
      <p class="result-score" id="result-score"></p>
      <p class="result-msg" id="result-msg"></p>
      <button class="big-btn" id="retry-btn">Play again 🔄</button>
      <button class="big-btn" id="home-btn" style="background:#1565C0; margin-top:10px;">Choose another game 🎮</button>
    </div>
  </div>
</div>

const WORDS = [
  ["damage",     "When something is broken or hurt, for example by a storm"],
  ["coast",      "The land next to the sea"],
  ["sightseeing","Visiting famous and interesting places"],
  ["rescue",     "To save someone who is in danger"],
  ["canoe",      "A small, light boat that you move with a paddle"],
  ["waterfall",  "Water falling down from a high place over rocks"],
  ["tour",       "A trip to visit different interesting places"],
  ["guide",      "A person who shows places to visitors"],
  ["tourist",    "A person who travels to visit places for fun"],
  ["culture",    "The music, food, dances and traditions of a place"],
  ["camping",    "Sleeping outdoors in a tent"],
  ["cabin",      "A small wooden house in the forest or mountains"],
  ["campfire",   "A fire made outdoors when you go camping"],
  ["hiking",     "Walking a long way in the mountains or in nature"],
  ["souvenir",   "A small gift you buy to remember a trip"],
  ["castle",     "A very old, big building with towers where kings lived"]
];

// Comparatives & Superlatives — la primera opción es la correcta
const GRAMMAR = [
  ["🏠", "My house is (big) ___ than yours.", ["bigger","more big","biggest"]],
  ["🌸", "This flower is (beautiful) ___ than that one.", ["more beautiful","beautifuler","most beautiful"]],
  ["📚", "This is the (interesting) ___ book of all the library!", ["most interesting","more interesting","interestingest"]],
  ["🚭", "Smoking is (bad) ___ than drinking alcohol.", ["worse","more bad","badder"]],
  ["🦁", "Which is the (dangerous) ___ animal in the world?", ["most dangerous","more dangerous","dangerouser"]],
  ["🌊", "A holiday by the sea is (good) ___ than a holiday in the mountains.", ["better","good","most good"]],
  ["🥤", "A coke is (expensive) ___ than a water.", ["more expensive","most expensive","expensivier"]],
  ["💰", "Who is the (rich) ___ woman on earth?", ["richest","more rich","most richest"]],
  ["⛈️", "The weather this summer is (bad) ___ than last summer.", ["worse","worst","badder"]],
  ["🇬🇧", "London is the (large) ___ city in England.", ["largest","more large","larger"]]
];

const PRAISE = ["Excellent! 🎉","Great job! 🌟","Correct! ✅","Awesome! 🥳","You rock! 💪"];
const OOPS = ["Almost! The answer was: ","Oops 👀 The correct answer was: ","No worries, it was: "];

let questions = [], idx = 0, score = 0, currentMode = "";

const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function otherWords(word, n){
  return shuffle(WORDS.map(w => w[0]).filter(w => w !== word)).slice(0, n);
}

// imagen → palabra
function qLook(word){
  const opts = shuffle([word].concat(otherWords(word, 3)));
  return { cat: "🖼️ Look & Choose", type: "word", img: word, q: "What is this?", opts, a: opts.indexOf(word) };
}
// palabra → imagen
function qFind(word){
  const opts = shuffle([word].concat(otherWords(word, 3)));
  return { cat: "👀 Find the Picture", type: "img", word, q: "Tap the picture that shows:", opts, a: opts.indexOf(word) };
}
// definición → palabra
function qMean(word, def){
  const opts = shuffle([word].concat(otherWords(word, 3)));
  return { cat: "📖 What Does It Mean?", type: "word", q: def, opts, a: opts.indexOf(word) };
}
// comparativos y superlativos
function qGram(item){
  const [emoji, sentence, options] = item;
  const correct = options[0];
  const opts = shuffle(options);
  return { cat: "✏️ Comparatives & Superlatives", type: "word", emoji, q: sentence, opts, a: opts.indexOf(correct) };
}

function buildRound(mode){
  const ws = shuffle(WORDS);
  if (mode === "look") return ws.slice(0, 12).map(w => qLook(w[0]));
  if (mode === "find") return ws.slice(0, 12).map(w => qFind(w[0]));
  if (mode === "mean") return ws.slice(0, 12).map(w => qMean(w[0], w[1]));
  if (mode === "gram") return shuffle(GRAMMAR).map(g => qGram(g));
  // todos: 12 de vocabulario + 6 de gramática
  return shuffle(ws.slice(0, 12).map(w => pickType(w)).concat(shuffle(GRAMMAR).slice(0, 6).map(g => qGram(g))));
}
function pickType(w){
  const r = Math.random();
  return r < .34 ? qLook(w[0]) : r < .67 ? qFind(w[0]) : qMean(w[0], w[1]);
}

function startQuiz(mode){
  currentMode = mode;
  questions = buildRound(mode);
  idx = 0; score = 0;
  show("screen-quiz");
  renderQuestion();
}

function show(id){
  for (const s of ["screen-start","screen-quiz","screen-result"])
    document.getElementById(s).classList.toggle("hidden", s !== id);
}

function renderQuestion(){
  const q = questions[idx];
  document.getElementById("q-counter").textContent = (idx+1) + "/" + questions.length;
  document.getElementById("progress-bar").style.width = (idx / questions.length * 100) + "%";
  document.getElementById("score-chip").textContent = "⭐ " + score;
  document.getElementById("q-category").textContent = q.cat;
  const vis = document.getElementById("q-visual");
  if (q.img) vis.innerHTML = '<img src="' + IMGS[q.img] + '" alt="">';
  else if (q.type === "img") vis.innerHTML = '<div class="big-word">' + q.word + '</div>';
  else if (q.emoji) vis.innerHTML = '<div class="big-emoji">' + q.emoji + '</div>';
  else vis.innerHTML = "";
  document.getElementById("q-text").textContent = q.q;
  const box = document.getElementById("options");
  box.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt-btn" + (q.type === "img" ? " img-opt" : "");
    if (q.type === "img") b.innerHTML = '<img src="' + IMGS[opt] + '" alt="">';
    else b.textContent = opt;
    b.addEventListener("click", () => answer(i, b), {passive:true});
    box.appendChild(b);
  });
  const fb = document.getElementById("feedback");
  fb.textContent = ""; fb.className = "feedback";
  document.getElementById("next-btn").classList.remove("show");
}

function answer(i, btn){
  const q = questions[idx];
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById("feedback");
  const correctWord = q.opts[q.a];
  if (i === q.a) {
    score++;
    btn.classList.add("correct");
    fb.textContent = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    fb.classList.add("good");
  } else {
    btn.classList.add("wrong");
    buttons[q.a].classList.add("correct");
    fb.textContent = OOPS[Math.floor(Math.random()*OOPS.length)] + correctWord.charAt(0).toUpperCase() + correctWord.slice(1);
    fb.classList.add("bad");
  }
  document.getElementById("score-chip").textContent = "⭐ " + score;
  const nb = document.getElementById("next-btn");
  nb.classList.add("show");
  nb.textContent = (idx === questions.length-1) ? "See results 🏁" : "Next ➜";
}

function finish(){
  document.getElementById("progress-bar").style.width = "100%";
  const pct = score / questions.length;
  const stars = pct === 1 ? 5 : pct >= .9 ? 4 : pct >= .7 ? 3 : pct >= .5 ? 2 : 1;
  document.getElementById("stars").textContent = "⭐".repeat(stars) + "☆".repeat(5-stars);
  document.getElementById("result-score").textContent = "You got " + score + " out of " + questions.length + "!";
  document.getElementById("result-emoji").textContent = pct === 1 ? "🏆" : pct >= .7 ? "🎉" : pct >= .5 ? "😊" : "💪";
  document.getElementById("result-title").textContent =
    pct === 1 ? "PERFECT, Luciana!" : pct >= .7 ? "Great work!" : pct >= .5 ? "Good try!" : "Keep practicing!";
  document.getElementById("result-msg").textContent =
    pct === 1 ? "You are a vocabulary champion! 🏕️✨" :
    pct >= .7 ? "You almost know all the words!" :
    pct >= .5 ? "Practice a little more and you'll be a champion." :
    "Every try makes you better. One more time!";
  show("screen-result");
}

document.getElementById("next-btn").addEventListener("click", () => {
  if (idx === questions.length - 1) { finish(); return; }
  idx++;
  renderQuestion();
});
document.getElementById("retry-btn").addEventListener("click", () => startQuiz(currentMode));
document.getElementById("home-btn").addEventListener("click", () => show("screen-start"));

/* ---------- botón de salir de la práctica ---------- */
(function(){
  const ov = document.createElement("div");
  ov.className = "exit-ov hidden";
  ov.innerHTML = '<div class="exit-box"><p>Do you want to leave the practice?</p>' +
    '<button class="exit-yes">Yes, exit 🚪</button>' +
    '<button class="exit-no">Keep practicing 💪</button></div>';
  document.body.appendChild(ov);
  const hide = () => ov.classList.add("hidden");
  ov.querySelector(".exit-no").addEventListener("click", hide, {passive:true});
  ov.querySelector(".exit-yes").addEventListener("click", () => { hide(); show("screen-start"); }, {passive:true});
  document.getElementById("close-btn").addEventListener("click", () => ov.classList.remove("hidden"), {passive:true});
})();

const MODES = [
  ["look", "🖼️", "Look & Choose"],
  ["find", "👀", "Find the Picture"],
  ["mean", "📖", "What Does It Mean?"],
  ["gram", "✏️", "Comparatives & Superlatives"]
];
const grid = document.getElementById("topic-grid");
for (const [key, icon, label] of MODES) {
  const b = document.createElement("button");
  b.className = "topic-btn";
  b.innerHTML = '<span class="icon">' + icon + '</span>' + label;
  b.addEventListener("click", () => startQuiz(key), {passive:true});
  grid.appendChild(b);
}
const all = document.createElement("button");
all.className = "topic-btn all";
all.innerHTML = '<span class="icon">🌟</span>Full practice! (all 16 words)';
all.addEventListener("click", () => startQuiz("todos"), {passive:true});
grid.appendChild(all);
</script>
