<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Spelling Practice — The Human Body</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(160deg, #E0F2F1 0%, #F3E5F5 100%);
    color: #222;
    margin: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .app { max-width: 760px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
  .board {
    background: #fff;
    border: 6px solid #00897B;
    border-radius: 26px;
    padding: 20px 22px 26px;
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  h1 { text-align: center; color: #00695C; margin: 6px 0 2px; font-size: clamp(22px, 5vw, 32px); }
  .subtitle { text-align: center; color: #777; font-style: italic; margin: 0 0 14px; font-size: clamp(14px, 3vw, 17px); }
  .intro-emoji { text-align: center; font-size: 56px; margin: 8px 0; }
  .choose-label { text-align: center; color: #00695C; font-weight: bold; font-size: 19px; margin: 10px 0 14px; }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .topic-btn {
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    color: #004D40;
    background: #E0F2F1;
    border: 3px solid #26A69A;
    border-radius: 18px;
    padding: 16px 12px;
    min-height: 64px;
    cursor: pointer;
    transition: transform .1s;
  }
  .topic-btn:active { transform: scale(.96); background: #B2DFDB; }
  .topic-btn.all { background: #F3E5F5; border-color: #8E24AA; color: #4A148C; }
  .topic-btn .icon { font-size: 26px; display: block; margin-bottom: 4px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; font-size: 16px; color: #555; font-weight: bold; }
  .progress-wrap { flex: 1; height: 16px; background: #eee; border-radius: 10px; overflow: hidden; border: 2px solid #ddd; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #26A69A, #8E24AA); border-radius: 10px; transition: width .3s; }
  .score-chip { background: #E0F2F1; border: 2px solid #26A69A; border-radius: 12px; padding: 4px 12px; color: #00695C; white-space: nowrap; }
  .q-category { text-align: center; font-size: 15px; color: #888; margin-bottom: 2px; }
  .q-visual { text-align: center; margin: 4px 0; }
  .q-visual img {
    max-width: min(220px, 70%);
    max-height: 155px;
    border-radius: 14px;
    border: 3px solid #B2DFDB;
    background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.10);
  }
  .q-text {
    text-align: center;
    font-size: clamp(17px, 3.6vw, 21px);
    color: #00695C;
    font-weight: bold;
    margin: 8px 0 12px;
    min-height: 30px;
  }
  /* pista fonética estilo tarjeta */
  .sound-card {
    text-align: center;
    font-family: "Courier New", monospace;
    font-size: clamp(30px, 7vw, 44px);
    font-weight: bold;
    color: #C2185B;
    background: #FCE4EC;
    border: 3px dashed #EC407A;
    border-radius: 16px;
    padding: 10px 18px;
    width: fit-content;
    margin: 6px auto;
    letter-spacing: 3px;
  }
  .syl-hint { text-align: center; font-size: 17px; color: #999; margin-top: 4px; }
  /* opciones */
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt-btn {
    font-family: inherit;
    font-size: 21px;
    font-weight: bold;
    text-align: center;
    background: #fff;
    color: #333;
    border: 3px solid #80CBC4;
    border-radius: 16px;
    padding: 14px 10px;
    min-height: 58px;
    cursor: pointer;
    transition: transform .08s;
    letter-spacing: 1px;
  }
  .opt-btn:active { transform: scale(.97); }
  .opt-btn.correct { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
  .opt-btn.wrong { background: #FFEBEE; border-color: #E57373; color: #B71C1C; }
  .opt-btn .miss { color: #C2185B; }
  /* build the word */
  .slots { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; margin: 10px 0 14px; }
  .slot {
    width: 40px; height: 52px;
    border-bottom: 4px solid #26A69A;
    background: #F1F8F7;
    border-radius: 6px;
    font-size: 28px;
    font-weight: bold;
    color: #00695C;
    display: flex; align-items: center; justify-content: center;
    text-transform: lowercase;
  }
  .slot.filled { background: #E0F2F1; }
  .slot.ok { background: #E8F5E9; border-bottom-color: #4CAF50; color: #1B5E20; }
  .slot.bad { background: #FFEBEE; border-bottom-color: #E57373; color: #B71C1C; }
  .tiles { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; }
  .tile {
    font-family: inherit;
    width: 52px; height: 56px;
    font-size: 27px;
    font-weight: bold;
    color: #4A148C;
    background: #F3E5F5;
    border: 3px solid #8E24AA;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .08s;
  }
  .tile:active { transform: scale(.92); }
  .tile.used { opacity: .25; pointer-events: none; }
  .undo-btn {
    font-family: inherit;
    display: block;
    margin: 14px auto 0;
    font-size: 16px;
    font-weight: bold;
    color: #00695C;
    background: #fff;
    border: 3px solid #B2DFDB;
    border-radius: 14px;
    padding: 10px 22px;
    min-height: 46px;
    cursor: pointer;
  }
  .feedback { text-align: center; font-size: 18px; font-weight: bold; min-height: 28px; margin: 14px 0 4px; }
  .feedback.good { color: #2E7D32; }
  .feedback.bad { color: #C62828; }
  .next-btn, .big-btn {
    font-family: inherit;
    display: block;
    margin: 10px auto 0;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    background: #00897B;
    border: none;
    border-radius: 16px;
    padding: 15px 38px;
    min-height: 56px;
    cursor: pointer;
    visibility: hidden;
  }
  .next-btn.show, .big-btn { visibility: visible; }
  .next-btn:active, .big-btn:active { transform: scale(.97); }
  .result-emoji { text-align: center; font-size: 72px; margin: 10px 0; }
  .result-title { text-align: center; font-size: 30px; color: #00695C; font-weight: bold; margin: 4px 0; }
  .result-score { text-align: center; font-size: 22px; color: #555; margin: 6px 0 4px; }
  .stars { text-align: center; font-size: 40px; letter-spacing: 6px; margin: 8px 0; }
  .result-msg { text-align: center; font-size: 18px; color: #666; margin-bottom: 10px; }
  .word-list { text-align: center; font-size: 15px; color: #888; margin: 10px 14px 0; line-height: 1.9; }
  .word-list b { color: #00695C; }
  /* ---------- botón de salir ---------- */
  .close-btn {
    font-family: inherit;
    font-size: 19px; font-weight: bold; line-height: 1;
    color: #90A4AE; background: #fff;
    border: 2px solid #CFD8DC; border-radius: 50%;
    width: 38px; height: 38px; min-width: 38px;
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .close-btn:active { transform: scale(.92); background: #ECEFF1; }
  .exit-ov {
    position: fixed; inset: 0; z-index: 99;
    background: rgba(38,50,56,.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .exit-box {
    background: #fff; border-radius: 22px;
    padding: 24px 22px; max-width: 340px; width: 100%;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .exit-box p { font-size: 19px; font-weight: bold; color: #37474F; margin: 4px 0 18px; }
  .exit-box button {
    font-family: inherit; font-size: 17px; font-weight: bold;
    display: block; width: 100%; margin: 9px 0;
    border-radius: 14px; min-height: 52px; cursor: pointer; border: 3px solid transparent;
  }
  .exit-box .exit-yes { background: #EF5350; color: #fff; }
  .exit-box .exit-no { background: #fff; color: #546E7A; border-color: #CFD8DC; }
  .exit-box button:active { transform: scale(.97); }
  /* ---------- migas de pan ---------- */
  .crumbs {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px; margin: 0 0 10px; font-size: 14px;
  }
  .crumbs a {
    text-decoration: none; color: #546E7A;
    background: rgba(255,255,255,.92); border: 2px solid #CFD8DC;
    border-radius: 16px; padding: 6px 13px; white-space: nowrap;
  }
  .crumbs a:active { transform: scale(.96); }
  .crumbs .sep { color: #B0BEC5; }
  .crumbs .here { color: #78909C; font-weight: bold; padding: 0 4px; white-space: nowrap; }
  .crumbs .back-btn {
    font-family: inherit; font-size: 14px; font-weight: bold;
    color: #fff; background: #546E7A; border: 2px solid #546E7A;
    border-radius: 16px; padding: 6px 14px; cursor: pointer; white-space: nowrap;
  }
  .crumbs .back-btn:active { transform: scale(.96); background: #37474F; }
  .hidden { display: none !important; }
</style>
</head>

      <button class="big-btn" id="retry-btn">Play again 🔄</button>
      <button class="big-btn" id="home-btn" style="background:#8E24AA; margin-top:10px;">Choose another game 🎮</button>
    </div>
  </div>
</div>

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const cap = w => w.charAt(0).toUpperCase() + w.slice(1);

// 1) imagen → escoger la escritura correcta
function qSpell(w){
  const [word, , , , wrong] = w;
  const opts = shuffle([word].concat(shuffle(wrong).slice(0, 3)));
  return { cat: "🖼️ Look & Spell", type: "choice", img: word, q: "Which one is spelled correctly?", opts, a: opts.indexOf(word) };
}
// 2) construir la palabra con letras
function qBuild(w){
  const [word, syl] = w;
  return { cat: "🔤 Build the Word", type: "build", img: word, word, syl, q: "Build the word with the letters" };
}

  const POOL = {
    1: ["c","k","s","g","t","b","n","z"],
    2: ["ai","ou","oi","ch","ce","ge","ll","es","on","ga","sh","ck","th","ei","au","ea"],
    3: ["ine","ele","ain","oun","ake","ell","ith","ent","ong","eal"]
  };
  const pool = POOL[hard.length] || POOL[2];
  const opts = shuffle([hard].concat(shuffle(pool.filter(p => p !== hard)).slice(0, 3)));
  return { cat: "✏️ Missing Letters", type: "choice", img: word, q: "Which letters are missing?  " + shown.split("").join(" "), opts, a: opts.indexOf(hard) };
}
// 4) suena como… → escoger la palabra escrita
function qSound(w){
  const [word, , sound] = w;
  const opts = shuffle([word].concat(shuffle(WORDS.map(x => x[0]).filter(x => x !== word)).slice(0, 3)));
  return { cat: "🔊 It Sounds Like…", type: "choice", sound, q: "Which word sounds like this?", opts, a: opts.indexOf(word) };
}
// 5) sílabas
function qSyl(w){
  const [word, syl] = w;
  const others = shuffle(WORDS.filter(x => x[1] !== syl && x[1].includes("-"))).slice(0, 3).map(x => x[1]);
  const wrongSplits = word.length > 4
    ? [word.slice(0,2) + "-" + word.slice(2), word.slice(0,4) + "-" + word.slice(4)].filter(s => s !== syl)
    : [];
  const distract = (wrongSplits.length >= 2 ? wrongSplits.slice(0,2).concat(others.slice(0,1)) : others).slice(0,3);
  const opts = shuffle([syl].concat(distract));
  return { cat: "🎵 Syllables", type: "choice", img: word, q: "How do we split “" + word + "” into syllables?", opts, a: opts.indexOf(syl) };
}

const MODES = [
  ["spell",   "🖼️", "Look &amp; Spell"],
  ["build",   "🔤", "Build the Word"],
  ["missing", "✏️", "Missing Letters"],
  ["sound",   "🔊", "It Sounds Like…"]
];
const GEN = { spell: qSpell, build: qBuild, missing: qMissing, sound: qSound, syl: qSyl };

function buildRound(mode){
  const ws = shuffle(WORDS);
  if (mode !== "todos") return ws.map(w => GEN[mode](w));
  const kinds = ["spell","build","missing","sound","syl"];
  return ws.map((w, i) => GEN[kinds[i % kinds.length]](w));
}

function startQuiz(mode){
  currentMode = mode;
  questions = shuffle(buildRound(mode));
  idx = 0; score = 0;
  show("screen-quiz");
  renderQuestion();
}

function show(id){
  for (const s of ["screen-start","screen-quiz","screen-result"])
    document.getElementById(s).classList.toggle("hidden", s !== id);
}

function renderQuestion(){
  const q = questions[idx];
  answered = false;
  document.getElementById("q-counter").textContent = (idx+1) + "/" + questions.length;
  document.getElementById("progress-bar").style.width = (idx / questions.length * 100) + "%";
  document.getElementById("score-chip").textContent = "⭐ " + score;
  document.getElementById("q-category").textContent = q.cat;
  const vis = document.getElementById("q-visual");
  if (q.img && IMGS[q.img]) vis.innerHTML = '<img src="' + IMGS[q.img] + '" alt="">';
  else if (q.sound) vis.innerHTML = '<div class="sound-card">' + q.sound + '</div>';
  else vis.innerHTML = "";
  document.getElementById("q-text").textContent = q.q;
  const area = document.getElementById("q-area");
  area.innerHTML = "";
  const fb = document.getElementById("feedback");
  fb.textContent = ""; fb.className = "feedback";
  document.getElementById("next-btn").classList.remove("show");

  if (q.type === "choice") renderChoice(q, area);
  else renderBuild(q, area);
}

function renderChoice(q, area){
  const box = document.createElement("div");
  box.className = "options";
  q.opts.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.textContent = opt;
    b.addEventListener("click", () => answerChoice(i, b), {passive:true});
    box.appendChild(b);
  });
  area.appendChild(box);
}

function renderBuild(q, area){
  const word = q.word;
  buildState = { picked: [], tiles: shuffle(word.split("")) };
  const slots = document.createElement("div");
  slots.className = "slots";
  for (let i = 0; i < word.length; i++) {
    const s = document.createElement("div");
    s.className = "slot";
    slots.appendChild(s);
  }
  const tiles = document.createElement("div");
  tiles.className = "tiles";
  buildState.tiles.forEach((ch, i) => {
    const t = document.createElement("button");
    t.className = "tile";
    t.textContent = ch;
    t.addEventListener("click", () => tapTile(i, q), {passive:true});
    tiles.appendChild(t);
  });
  const undo = document.createElement("button");
  undo.className = "undo-btn";
  undo.textContent = "⌫ Undo";
  undo.addEventListener("click", () => undoTile(q), {passive:true});
  const hint = document.createElement("p");
  hint.className = "syl-hint";
  hint.textContent = q.syl.includes("-") ? "Hint: " + q.syl : "";
  area.appendChild(slots);
  area.appendChild(tiles);
  area.appendChild(undo);
  area.appendChild(hint);
  buildState.slotEls = slots.children;
  buildState.tileEls = tiles.children;
  buildState.undoEl = undo;
}

function tapTile(i, q){
  if (answered) return;
  const bs = buildState;
  if (bs.picked.length >= q.word.length) return;
  bs.picked.push(i);
  bs.tileEls[i].classList.add("used");
  const slot = bs.slotEls[bs.picked.length - 1];
  slot.textContent = bs.tiles[i];
  slot.classList.add("filled");
  if (bs.picked.length === q.word.length) checkBuild(q);
}

function undoTile(q){
  if (answered) return;
  const bs = buildState;
  if (!bs.picked.length) return;
  const i = bs.picked.pop();
  bs.tileEls[i].classList.remove("used");
  const slot = bs.slotEls[bs.picked.length];
  slot.textContent = "";
  slot.classList.remove("filled");
}

function checkBuild(q){
  const bs = buildState;
  const made = bs.picked.map(i => bs.tiles[i]).join("");
  answered = true;
  bs.undoEl.style.visibility = "hidden";
  const ok = made === q.word;
  for (let i = 0; i < bs.slotEls.length; i++) {
    bs.slotEls[i].classList.add(ok ? "ok" : "bad");
    if (!ok) bs.slotEls[i].textContent = q.word[i];
  }
  finishAnswer(ok, q.word);
}

function answerChoice(i, btn){
  if (answered) return;
  answered = true;
  const q = questions[idx];
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  const ok = i === q.a;
  btn.classList.add(ok ? "correct" : "wrong");
  if (!ok && buttons[q.a]) buttons[q.a].classList.add("correct");
  finishAnswer(ok, q.opts[q.a]);
}

function finishAnswer(ok, correctText){
  const fb = document.getElementById("feedback");
  if (ok) {
    score++;
    fb.textContent = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    fb.classList.add("good");
  } else {
    fb.textContent = OOPS[Math.floor(Math.random()*OOPS.length)] + cap(correctText);
    fb.classList.add("bad");
  }
  document.getElementById("score-chip").textContent = "⭐ " + score;
  const nb = document.getElementById("next-btn");
  nb.classList.add("show");
  nb.textContent = (idx === questions.length-1) ? "See results 🏁" : "Next ➜";
}

function finish(){
  document.getElementById("progress-bar").style.width = "100%";
  const pct = score / questions.length;
  const stars = pct === 1 ? 5 : pct >= .9 ? 4 : pct >= .7 ? 3 : pct >= .5 ? 2 : 1;
  document.getElementById("stars").textContent = "⭐".repeat(stars) + "☆".repeat(5-stars);
  document.getElementById("result-score").textContent = "You got " + score + " out of " + questions.length + "!";
  document.getElementById("result-emoji").textContent = pct === 1 ? "🏆" : pct >= .7 ? "🎉" : pct >= .5 ? "😊" : "💪";
  document.getElementById("result-title").textContent =
    pct === 1 ? "PERFECT, Luciana!" : pct >= .7 ? "Great spelling!" : pct >= .5 ? "Good try!" : "Keep practicing!";
  document.getElementById("result-msg").textContent =
    pct === 1 ? "You are a spelling champion! 🦴✨" :
    pct >= .7 ? "You almost know every word!" :
    pct >= .5 ? "Look – cover – say, and try again." :
    "Read the cards once more and try again!";
  show("screen-result");
}

document.getElementById("next-btn").addEventListener("click", () => {
  if (idx === questions.length - 1) { finish(); return; }
  idx++;
  renderQuestion();
});
document.getElementById("retry-btn").addEventListener("click", () => startQuiz(currentMode));
document.getElementById("home-btn").addEventListener("click", () => show("screen-start"));

/* ---------- botón de salir de la práctica ---------- */
(function(){
  const ov = document.createElement("div");
  ov.className = "exit-ov hidden";
  ov.innerHTML = '<div class="exit-box"><p>Do you want to leave the practice?</p>' +
    '<button class="exit-yes">Yes, exit 🚪</button>' +
    '<button class="exit-no">Keep practicing 💪</button></div>';
  document.body.appendChild(ov);
  const hide = () => ov.classList.add("hidden");
  ov.querySelector(".exit-no").addEventListener("click", hide, {passive:true});
  ov.querySelector(".exit-yes").addEventListener("click", () => { hide(); show("screen-start"); }, {passive:true});
  document.getElementById("close-btn").addEventListener("click", () => ov.classList.remove("hidden"), {passive:true});
})();

const grid = document.getElementById("topic-grid");
for (const [key, icon, label] of MODES) {
  const b = document.createElement("button");
  b.className = "topic-btn";
  b.innerHTML = '<span class="icon">' + icon + '</span>' + label;
  b.addEventListener("click", () => startQuiz(key), {passive:true});
  grid.appendChild(b);
}
const all = document.createElement("button");
all.className = "topic-btn all";
all.innerHTML = '<span class="icon">🌟</span>Full practice! (all 14 words)';
all.addEventListener("click", () => startQuiz("todos"), {passive:true});
grid.appendChild(all);

document.getElementById("word-list").innerHTML =
  "<b>Our 14 words:</b> " + WORDS.map(w => w[0]).join(" · ");
</script>
